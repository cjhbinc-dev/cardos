[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/auth/confirm"
  to = "/"
  status = 200
  force = false

# Block stray backup files from being publicly served
[[redirects]]
  from = "/big-dreamers-materials.html"
  to = "/404"
  status = 404
  force = true

[functions]
  node_bundler = "esbuild"

[functions."notify-daily"]
  schedule = "0 8 * * *"

[functions."backup-daily"]
  schedule = "0 6 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/.netlify/functions/calendar-feed"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Access-Control-Allow-Origin = "*"
